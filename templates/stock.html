<!DOCTYPE html>
<html>
<head>
    <title>Blood Stock</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
        }

        h2 {
            margin-top: 40px;
        }

        table {
            margin: 40px auto;
            border-collapse: collapse;
            width: 50%;
            background: white;
            color: black;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
        }

        th {
            background-color: red;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

<h2>🩸 Blood Stock Dashboard</h2>

<table>
    <tr>
        <th>Blood Group</th>
        <th>Units Available</th>
    </tr>
    {% for item in stock %}
    <tr>
        <td>{{ item.blood_group }}</td>
        <td>{{ item.units }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/">⬅ Back Home</a>

</body>
</html>
